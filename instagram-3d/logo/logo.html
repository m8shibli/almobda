<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cairo; font-weight: 800; src: url(cairo-arabic-800-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 800; src: url(cairo-latin-800-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: transparent; }
  .frame { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
  #full { display: none; width: 1600px; height: 900px; }
  body.full #icon { display: none; }
  body.full #full { display: block; }
  svg { display: block; }
  text { font-family: Cairo, sans-serif; font-weight: 800; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0A1022"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF6A13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA7BD"/>
      <stop offset=".45" stop-color="#F1F5FB"/>
      <stop offset="1" stop-color="#7E8BA3"/>
    </linearGradient>
    <!-- layer lines: parallel to the cube's isometric edges -->
    <pattern id="layersL" width="40" height="26" patternUnits="userSpaceOnUse" patternTransform="skewY(30)">
      <rect width="40" height="26" fill="#1FB5D6"/>
      <rect y="20" width="40" height="6" fill="#0E6F88"/>
    </pattern>
    <pattern id="layersR" width="40" height="26" patternUnits="userSpaceOnUse" patternTransform="skewY(-30)">
      <rect width="40" height="26" fill="#7FE6FA"/>
      <rect y="20" width="40" height="6" fill="#2BA9C6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- the mark: a cube being printed layer by layer, nozzle on top -->
    <g id="mark">
      <!-- cube centred on (540,640), edge 220 -->
      <polygon points="349,530 540,640 540,860 349,750" fill="url(#layersL)"/>
      <polygon points="540,640 731,530 731,750 540,860" fill="url(#layersR)"/>
      <polygon points="540,420 731,530 540,640 349,530" fill="url(#hot)"/>
      <!-- printed path on the top layer -->
      <polyline points="430,530 540,467 650,530 540,593 470,553 540,513 600,548" fill="none" stroke="#FFF3E0" stroke-opacity=".55" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="349,530 540,640 731,530 540,420" fill="none" stroke="#0A1022" stroke-opacity=".25" stroke-width="4"/>
      <!-- nozzle -->
      <rect x="470" y="150" width="140" height="110" rx="14" fill="url(#metal)"/>
      <rect x="470" y="196" width="140" height="10" fill="#0A1022" opacity=".18"/>
      <polygon points="490,260 590,260 562,330 518,330" fill="url(#metal)"/>
      <polygon points="518,330 562,330 548,372 532,372" fill="#FF8A2A"/>
      <!-- extruded drop -->
      <line x1="540" y1="378" x2="540" y2="512" stroke="url(#hot)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="540" cy="526" r="13" fill="#FFF3E0" filter="url(#glow)"/>
    </g>
  </defs>
</svg>

<!-- 1) Profile picture (Instagram crops it to a circle) -->
<div class="frame" id="icon">
  <svg width="1080" height="1080" viewBox="0 0 1080 1080">
    <circle cx="540" cy="540" r="540" fill="url(#bg)"/>
    <circle cx="540" cy="540" r="500" fill="none" stroke="#FF7A1A" stroke-width="10" stroke-dasharray="4 26" stroke-linecap="round" opacity=".55"/>
    <g transform="translate(540 520) scale(.82) translate(-540 -540)"><use href="#mark"/></g>
    <text x="540" y="985" text-anchor="middle" font-size="96" fill="#FFFFFF" direction="rtl">المبدع <tspan fill="#FF8A2A">3D</tspan></text>
  </svg>
</div>

<!-- 2) Full horizontal logo (for posts, packaging, stickers) -->
<div class="frame" id="full">
  <svg width="1600" height="900" viewBox="0 0 1600 900" style="direction:ltr">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <g transform="translate(1240 450) scale(.78) translate(-540 -500)"><use href="#mark"/></g>
    <text x="960" y="430" text-anchor="end" font-size="230" fill="#FFFFFF">المبدع</text>
    <text x="960" y="600" text-anchor="end" font-size="120" fill="#FF8A2A">3D PRINT</text>
    <text x="960" y="700" text-anchor="end" font-size="48" fill="#9FD9E8">نطبع أفكارك… طبقة بطبقة</text>
  </svg>
</div>
</body>
</html>
