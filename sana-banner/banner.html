<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Mada";src:url("assets/sf-mada-bold.ttf") format("truetype")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d1a}
body{font-family:"Mada",sans-serif;position:relative;color:#fff}
#sky{position:absolute;inset:0;background:
 radial-gradient(ellipse 60% 35% at 30% 78%,rgba(190,215,205,.55),transparent 70%),
 linear-gradient(180deg,#070d1a 0%,#0e2036 24%,#34596b 46%,#7c9ea5 64%,#b4cdc6 78%,#c9d9cf 100%)}
#stars{position:absolute;inset:0;opacity:.7}
svg#scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
#shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(7,13,26,.9) 0%,rgba(7,13,26,.75) 38%,rgba(7,13,26,0) 60%)}
#txt{position:absolute;right:110px;top:90px;width:860px;text-align:right}
.pill{display:inline-block;background:#ffc832;color:#0b1220;font-size:38px;padding:14px 44px;border-radius:60px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h1{font-size:128px;line-height:1.1;margin-top:40px;text-shadow:0 6px 28px rgba(0,0,0,.55)}
h1 b{color:#ffc832;font-weight:normal}
.sub{font-size:46px;line-height:1.5;margin-top:22px;color:#e8eef7;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.chips{display:flex;gap:22px;margin-top:34px;justify-content:flex-start}
.chip{display:flex;align-items:center;gap:14px;background:rgba(11,18,32,.72);border:2px solid #ffc832;border-radius:50px;padding:10px 34px 10px 22px;font-size:40px;backdrop-filter:blur(4px)}
.chip svg{width:34px;height:34px}
#foot{position:absolute;left:100px;right:110px;bottom:60px;display:flex;justify-content:space-between;align-items:flex-end}
.tag{font-size:42px;color:#eef3fa}
.logo{font-size:92px;line-height:1}.logo i{font-style:normal;color:#ffc832}
.pr{position:absolute;bottom:0;height:900px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}#p1{left:60px}#p2{left:480px}
</style></head><body>
<div id="sky"></div><canvas id="stars" width="1920" height="700"></canvas>
<svg id="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>
 <linearGradient id="fortg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a35"/><stop offset="1" stop-color="#0b1119"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10151c"/><stop offset="1" stop-color="#05080d"/></linearGradient>
 <symbol id="mic" viewBox="0 0 24 24"><path fill="#ffc832" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></symbol>
 <g id="presenter">
  <path d="M-120 0 C-120 -150 -105 -250 -50 -290 L-22 -310 L22 -310 L50 -290 C105 -250 120 -150 120 0Z" fill="#090e15"/>
  <path d="M-24 -312 L24 -312 L18 -340 L-18 -340Z" fill="#090e15"/>
  <ellipse cx="0" cy="-385" rx="44" ry="54" fill="#090e15"/>
  <path d="M-62 -392 C-66 -470 -20 -500 8 -498 C56 -496 70 -440 62 -392 C40 -418 -40 -418 -62 -392Z" fill="#090e15"/>
  <path d="M-60 -398 C-30 -416 38 -416 60 -398" stroke="#1d2b38" stroke-width="3" fill="none"/>
  <path d="M0 -310 V-240" stroke="#1d2b38" stroke-width="3"/><circle cx="0" cy="-232" r="6" fill="#1d2b38"/>
 </g>
</defs>
<g id="fort" transform="translate(-60 0)"></g>
<g id="palms"></g>
<path d="M0 930 Q300 880 620 905 T1250 890 T1920 925 L1920 1080 L0 1080Z" fill="url(#ground)"/>
<g id="ppl"></g>
<path d="M0 985 Q400 950 900 975 T1920 960 L1920 1080 L0 1080Z" fill="#05080d"/>
</svg>
<img class="pr" id="p1" src="assets/presenter-official.png" onerror="this.remove()"><img class="pr" id="p2" src="assets/presenter-comic.png" onerror="this.remove()">
<div id="shade"></div>
<div id="txt">
 <div class="pill">إعلان تعاون في منصة سويقنا</div>
 <h1>نبحث عن <b>مذيع</b><br>في المنصة</h1>
 <div class="sub">رسمي يقدّم الأخبار بثقة، أو فكاهي<br>يصنع الأجواء الحماسية؟</div>
 <div class="chips">
  <div class="chip"><svg><use href="#mic"/></svg>مذيع فكاهي</div>
  <div class="chip"><svg><use href="#mic"/></svg>مذيع رسمي</div>
 </div>
</div>
<div id="foot"><div class="logo">سويق<i>نا</i></div><div class="tag">صوت السويق وأهلها</div></div>
<script>
// stars
const c=document.getElementById('stars').getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<140;i++){const y=r()*r()*600;c.fillStyle=`rgba(255,255,255,${.25+r()*.6})`;c.beginPath();c.arc(r()*1920,y,r()*1.5+.3,0,7);c.fill()}
// fort (Suwayq-style: round tower + curtain wall with crenellations)
const NS="http://www.w3.org/2000/svg";const fort=document.getElementById('fort');
function add(p,t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function wall(x,w,top,base,step=26){add(fort,'rect',{x,y:top,width:w,height:base-top,fill:'url(#fortg)'});
 for(let i=0;i<w;i+=step)add(fort,'rect',{x:x+i,y:top-16,width:step/2,height:16,fill:'#1b2a35'})}
const base=930;
wall(180,900,790,base);                    // long wall
wall(300,150,690,base,25);                 // tower 1
wall(860,200,640,base,25);                 // main round tower
wall(760,60,745,base,20);
add(fort,'rect',{x:1000,y:560,width:6,height:100,fill:'#1b2a35'});   // flag pole
add(fort,'path',{d:'M1006 566 h76 v22 h-76 z',fill:'#2a1218'});add(fort,'path',{d:'M1006 588 h76 v10 h-76z',fill:'#122418'});
for(const [x,y,w,h] of [[380,730,22,48],[930,700,24,52],[1000,700,24,52],[900,800,22,50],[1000,800,22,50],[500,830,22,46],[640,830,22,46]])
 add(fort,'path',{d:`M${x} ${y+h} v${-h+11} a11 11 0 0 1 22 0 v${h-11}z`,fill:'#05080d',opacity:.8});
// palms
function palm(x,y,h,lean,sc){const g=add(document.getElementById('palms'),'g',{});
 add(g,'path',{d:`M${x} ${y} Q${x+lean*.4} ${y-h*.5} ${x+lean} ${y-h}`,stroke:'#080c12',"stroke-width":14*sc,fill:'none',"stroke-linecap":'round'});
 const tx=x+lean,ty=y-h;for(let i=-4;i<=4;i++){const a=i*.42-1.57,l=(150+(i%2?20:0))*sc;
  add(g,'path',{d:`M${tx} ${ty} Q${tx+Math.cos(a)*l*.6} ${ty+Math.sin(a)*l*.6-22*sc} ${tx+Math.cos(a)*l} ${ty+Math.sin(a)*l+44*sc}`,stroke:'#080c12',"stroke-width":7*sc,fill:'none',"stroke-linecap":'round'})}}
palm(70,940,330,60,1.1);palm(1090,935,260,-20,.85);
// presenters
const ppl=document.getElementById('ppl');
function who(x,sc,point){const g=add(ppl,'g',{transform:`translate(${x} 1010) scale(${sc})`});add(g,'use',{href:'#presenter'});
 // mic arm
 add(g,'path',{d:'M-84 -230 C-110 -150 -70 -120 -30 -170 L-8 -262',stroke:'#090e15',"stroke-width":36,fill:'none',"stroke-linecap":'round',"stroke-linejoin":'round'});
 add(g,'rect',{x:-26,y:-318,width:26,height:70,rx:13,fill:'#090e15',stroke:'#ffc832',"stroke-width":3,transform:'rotate(8 -13 -283)'});
 if(point)add(g,'path',{d:'M86 -232 C130 -200 150 -250 160 -300',stroke:'#090e15',"stroke-width":34,fill:'none',"stroke-linecap":'round'});
 else add(g,'path',{d:'M86 -232 C112 -160 100 -100 90 -60',stroke:'#090e15',"stroke-width":38,fill:'none',"stroke-linecap":'round'})}

</script></body></html>
